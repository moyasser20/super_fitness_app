name: super_fitness_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  another_flushbar: ^1.12.32
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.7.0
  equatable: ^2.0.5
  file_picker: ^8.1.2
  firebase_messaging: ^16.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_otp_text_field: ^1.1.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  fluttertoast: ^8.2.14
  get: ^4.7.2
  get_it: ^8.2.0
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.0
  injectable: ^2.5.1
  intl: any
  json_annotation: ^4.9.0
  loading_indicator: ^3.1.1
  logger: ^2.6.1
  mockito: null
  path_provider: ^2.1.5
  leak_tracker: ^10.0.8
  percent_indicator: ^4.2.5
  retrofit: ^4.1.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  step_progress_indicator: ^1.0.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.7.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/main_fitness_app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon3.png"


flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
        - asset: assets/fonts/Inter_18pt-Bold.ttf
        - asset: assets/fonts/BalooThambi2-Medium.ttf
    - family: BalooThambi2
      fonts:
        - asset: assets/fonts/BalooThambi2-Bold.ttf
        - asset: assets/fonts/BalooThambi2-ExtraBold.ttf
        - asset: assets/fonts/BalooThambi2-Medium.ttf
        - asset: assets/fonts/BalooThambi2-Regular.ttf
        - asset: assets/fonts/BalooThambi2-SemiBold.ttf